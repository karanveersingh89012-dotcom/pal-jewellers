workflows:
  android-release-build:
    name: Pal Jewellers - Build Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17

    scripts:
      - name: 1. Scaffold Missing Android Platform Files
        script: |
          echo "Generating native Android project files..."
          flutter create --org com.paljewellers .

      - name: 2. Configure Firebase and Google Services
        script: |
          echo "Setting up google-services.json and Gradle plugins..."
          
          # Move google-services.json into android/app/
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Successfully copied google-services.json to android/app/"
          elif [ -f "android/app/google-services.json" ]; then
            echo "google-services.json already present in android/app/"
          else
            echo "WARNING: google-services.json not found! Firebase might fail to build."
          fi

          # Automatically inject Google Services plugin and ensure minSdk is 21+
          python3 -c "
          import os

          # Inject Google Services into android/settings.gradle
          settings_path = 'android/settings.gradle'
          if os.path.exists(settings_path):
              with open(settings_path, 'r') as f:
                  content = f.read()
              if 'com.google.gms.google-services' not in content and 'plugins {' in content:
                  content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false')
                  with open(settings_path, 'w') as f:
                      f.write(content)
                  echo = 'Google Services plugin added to settings.gradle'

          # Inject Google Services and ensure minSdk 21 in android/app/build.gradle
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  content = f.read()
              
              if 'com.google.gms.google-services' not in content:
                  if 'plugins {' in content:
                      content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\"')
                  else:
                      content += '\napply plugin: \"com.google.gms.google-services\"\n'

              # Ensure minSdk is 21 or higher for Firebase compatibility
              content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')

              with open(app_gradle, 'w') as f:
                  f.write(content)
          "

      - name: 3. Install Dependencies
        script: |
          flutter pub get

      - name: 4. Generate Launcher Icons & Splash (if assets exist)
        script: |
          if [ -f "assets/icons/crown_pj_logo.png" ]; then
            echo "Generating PJ Crown app icon and splash screen..."
            dart run flutter_launcher_icons || true
            dart run flutter_native_splash:create || true
          else
            echo "assets/icons/crown_pj_logo.png not found, skipping icon generation."
          fi

      - name: 5. Build Release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/**/outputs/**/*.apk
